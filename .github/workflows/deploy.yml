name: Deploy

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - alpha
          - deploy
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Find branches that contain this tag
          BRANCHES=$(git branch -a --contains ${{ github.ref_name }})
          echo "Tag ${{ github.ref_name }} is found in these branches: $BRANCHES"
          if [[ ! "$BRANCHES" =~ "remotes/origin/release/" ]]; then
            echo "Error: Automated release tags must be pushed to a branch starting with 'release/'."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks
          echo "storeFile=${{ github.workspace }}/release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Set up local.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Set up Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Set up Play Store key
        run: echo '${{ secrets.PLAY_STORE_JSON_KEY }}' > play-store-key.json

      - name: Run Fastlane
        run: bundle exec fastlane "$FASTLANE_LANE"
        env:
          FASTLANE_LANE: >-
            ${{ 
              github.event_name == 'workflow_dispatch' && github.event.inputs.lane || 
              (startsWith(github.ref, 'refs/tags/') && 
                (contains(github.ref, '-alpha') && 'alpha' || 
                 contains(github.ref, '-rc') && 'beta' || 
                 'deploy')
              ) || 'beta' 
            }}
          PLAY_STORE_JSON_KEY_FILE: ${{ github.workspace }}/play-store-key.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
