<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#warmGrad)"/>
  <!-- Left panel (darker) for icon -->
  <rect x="0" y="0" width="400" height="500" fill="#BF360C" opacity="0.3"/>
  <!-- Icon replica (centered in left panel) -->
  <!-- Sun -->
  <circle cx="200" cy="160" r="36" fill="white" opacity="0.85"/>
  <!-- Horizon -->
  <line x1="80" y1="210" x2="320" y2="210" stroke="white" stroke-width="2" opacity="0.4"/>
  <!-- Road left edge -->
  <line x1="200" y1="210" x2="80" y2="420" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Road right edge -->
  <line x1="200" y1="210" x2="320" y2="420" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dashes -->
  <line x1="200" y1="225" x2="200" y2="255" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="199" y1="275" x2="198" y2="315" stroke="white" stroke-width="3.5" opacity="0.7" stroke-linecap="round"/>
  <line x1="197" y1="335" x2="195" y2="385" stroke="white" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
  <!-- Divider line -->
  <line x1="400" y1="60" x2="400" y2="440" stroke="white" stroke-width="1" opacity="0.15"/>
  <!-- Right panel: text -->
  <text x="712" y="210" text-anchor="middle" fill="white" font-size="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="8">VENICE</text>
  <!-- Decorative line under title -->
  <line x1="580" y1="235" x2="844" y2="235" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Tagline -->
  <text x="712" y="275" text-anchor="middle" fill="white" font-size="22" font-family="Arial, Helvetica, sans-serif" opacity="0.8" letter-spacing="6">PLAN YOUR ROAD TRIP</text>
  <!-- Feature bullets -->
  <circle cx="560" cy="340" r="4" fill="white" opacity="0.6"/>
  <text x="580" y="345" fill="white" font-size="16" font-family="Arial, Helvetica, sans-serif" opacity="0.6" letter-spacing="1">Route planning</text>
  <circle cx="560" cy="375" r="4" fill="white" opacity="0.6"/>
  <text x="580" y="380" fill="white" font-size="16" font-family="Arial, Helvetica, sans-serif" opacity="0.6" letter-spacing="1">Stop management</text>
  <circle cx="560" cy="410" r="4" fill="white" opacity="0.6"/>
  <text x="580" y="415" fill="white" font-size="16" font-family="Arial, Helvetica, sans-serif" opacity="0.6" letter-spacing="1">Trip progress tracking</text>
</svg>
